CONFIG_PRINTK=y

# TIME SLICING (Zephyr RTOS) - w skrocie:
# Kernel SAM, SILA przelacza miedzy watkami PREEMPTIBLE o ROWNYM priorytecie,
# nawet jesli zaden z nich sam nie oddaje CPU (brak k_yield()/k_msleep()).
# Bez tego jeden taki watek moglby zablokowac CPU na zawsze.
#
# CONFIG_TIMESLICING=y          - wlacza mechanizm
# CONFIG_TIMESLICE_SIZE=<ms>    - max czas jednej "tury" watku, potem wywlaszczenie
# CONFIG_TIMESLICE_PRIORITY=<n> - prog: dotyczy tylko watkow o priorytecie >= n
#                                  (mniejsza liczba = wyzszy priorytet)

CONFIG_TIMESLICING=y
CONFIG_TIMESLICE_SIZE=10
CONFIG_TIMESLICE_PRIORITY=0